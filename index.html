
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>家电维修教学系统</title>
<style>
:root{
  --bg:#F5F7FA;--bg2:#FFFFFF;--bg3:#EEF1F6;
  --text:#1C1F26;--text2:#5A6070;--text3:#9AA0AD;
  --border:#DDE2EA;--border2:#BCC3CF;
  --blue:#1558B0;--blue-bg:#EBF1FF;--blue-lt:#C9DDFF;
  --green:#1A6E45;--green-bg:#E6F5EE;
  --red:#B52A1C;--red-bg:#FDEEEC;--red-bd:#F5B7B1;
  --amber:#8C5510;--amber-bg:#FEF5E7;
  --purple:#4E30A0;--purple-bg:#F0ECFF;
  --teal:#0B6E82;--teal-bg:#E0F5FA;
  --r:10px;--r-lg:14px;--r-xl:18px;
  --shadow:0 1px 4px rgba(0,0,0,0.08),0 4px 16px rgba(0,0,0,0.05);
  --shadow-lg:0 4px 24px rgba(0,0,0,0.12);
  --touch:48px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100vh;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif;color:var(--text);line-height:1.6;font-size:16px;-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;-webkit-appearance:none;border:none}
input,select,textarea{font-family:inherit;font-size:16px;-webkit-appearance:none}

/* NAV */
.nav{position:sticky;top:0;z-index:100;background:var(--bg2);border-bottom:1px solid var(--border);min-height:54px;padding:0 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;box-shadow:0 1px 6px rgba(0,0,0,0.07)}
.nav-brand{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden}
.nav-brand span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.lang-wrap{display:flex;background:var(--bg3);border-radius:8px;padding:3px;gap:2px}
.lang-btn{padding:4px 10px;border-radius:6px;background:transparent;font-size:12px;font-weight:600;color:var(--text2);min-height:32px}
.lang-btn.on{background:var(--bg2);color:var(--blue);box-shadow:0 1px 4px rgba(0,0,0,0.10)}
.logout-btn{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:8px;border:1px solid var(--red-bd);font-size:13px;color:var(--red);background:transparent;min-height:var(--touch);white-space:nowrap}

/* MAIN */
.main{padding:16px 14px;max-width:880px;margin:0 auto}

/* LOGIN */
.login-wrap{max-width:420px;margin:16px auto}
.login-card{background:var(--bg2);border-radius:var(--r-xl);border:1px solid var(--border);padding:24px 20px;box-shadow:var(--shadow)}
.login-logo{text-align:center;margin-bottom:20px}
.login-logo .logo-icon{font-size:40px;display:block;margin-bottom:6px}
.login-logo h2{font-size:20px;font-weight:700}
.login-logo p{font-size:14px;color:var(--text2);margin-top:4px}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:600;color:var(--text2);margin-bottom:6px}
.field input{width:100%;padding:12px 14px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:16px;background:var(--bg);color:var(--text);outline:none}
.field input:focus{border-color:var(--blue);background:var(--bg2)}
.login-btn{width:100%;padding:14px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:16px;font-weight:700;min-height:var(--touch)}
.login-btn:active{background:#0D429E}
.err-box{background:var(--red-bg);border:1px solid var(--red-bd);color:var(--red);padding:10px 14px;border-radius:var(--r);font-size:14px;margin-bottom:14px}
.hint-box{margin-top:16px;background:var(--bg3);border-radius:var(--r);padding:12px}
.hint-title{font-size:13px;font-weight:700;color:var(--text2);margin-bottom:8px}
.hint-row{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:8px;cursor:pointer;flex-wrap:wrap;min-height:var(--touch)}
.hint-row:active{background:var(--bg2)}
.badge{display:inline-flex;font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px}
.badge-principal{background:var(--purple-bg);color:var(--purple)}
.badge-admin{background:var(--amber-bg);color:var(--amber)}
.badge-member{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.hint-em{font-family:monospace;font-size:13px;color:var(--blue)}
.hint-note{font-size:12px;color:var(--text3)}
.hint-nda{font-size:12px;color:var(--green);font-weight:600}

/* NDA */
.nda-page{max-width:600px;margin:0 auto}
.nda-alert{background:var(--red-bg);border:1px solid var(--red-bd);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start}
.nda-alert-icon{font-size:24px;flex-shrink:0}
.nda-alert h3{font-size:15px;font-weight:700;color:var(--red);margin-bottom:4px}
.nda-alert p{font-size:13px;color:#8B2019;line-height:1.6}
.nda-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.nda-card-hdr{padding:12px 16px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:14px;font-weight:700}
.nda-clauses{padding:14px 16px;max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.nda-clause{border-left:3px solid var(--red);padding:10px 12px;background:var(--bg3);border-radius:0 8px 8px 0;margin-bottom:10px;font-size:14px;line-height:1.8;color:var(--text2)}
.nda-clause:last-child{margin-bottom:0}
.nda-clause strong{color:var(--text);display:block;margin-bottom:3px}
.nda-agree-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.nda-chk-row{display:flex;align-items:flex-start;gap:12px;padding:12px;border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:10px;cursor:pointer}
.nda-chk-row:active{border-color:var(--blue);background:var(--blue-bg)}
.nda-chk-row input[type=checkbox]{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--blue)}
.nda-chk-lbl{font-size:14px;line-height:1.7;cursor:pointer}
.nda-agree-btn{width:100%;padding:14px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:6px;min-height:var(--touch)}
.nda-agree-btn:disabled{background:var(--bg3);color:var(--text3)}
.nda-session-note{font-size:13px;color:var(--text3);text-align:center;margin-top:10px}

/* TABS */
.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:12px 14px;font-size:13px;font-weight:600;border:none;border-bottom:2.5px solid transparent;color:var(--text2);background:transparent;white-space:nowrap;display:flex;align-items:center;gap:5px;min-height:var(--touch)}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}

/* CARD / TABLE */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;min-width:480px}
thead tr{background:var(--bg3)}
th{font-size:11px;font-weight:700;color:var(--text2);padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:12px 12px;font-size:13px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.st-on{background:var(--green-bg);color:var(--green);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.st-off{background:var(--red-bg);color:var(--red);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.dot-on{background:var(--green)}.dot-off{background:var(--red)}
.paid-y{background:var(--green-bg);color:var(--green);padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.paid-n{background:var(--amber-bg);color:var(--amber);padding:3px 9px;border-radius:6px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.act-btn{font-size:13px;padding:8px 12px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;margin-right:4px;white-space:nowrap;font-weight:600;min-height:var(--touch);display:inline-flex;align-items:center;gap:4px}
.act-btn.g{border-color:#7EC8A0;color:var(--green)}.act-btn.g:active{background:var(--green-bg)}
.act-btn.r{border-color:var(--red-bd);color:var(--red)}.act-btn.r:active{background:var(--red-bg)}
.act-btn.b{border-color:#90BAF0;color:var(--blue)}.act-btn.b:active{background:var(--blue-bg)}
.act-btn.a{border-color:#F0C88A;color:var(--amber)}.act-btn.a:active{background:var(--amber-bg)}
.tip-box{background:var(--blue-bg);border:1px solid var(--blue-lt);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--blue);margin-top:12px;display:flex;gap:8px;align-items:flex-start;line-height:1.6}

/* TAGS */
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;display:inline-block}
.tw{background:var(--blue-bg);color:var(--blue)}
.tf{background:var(--teal-bg);color:var(--teal)}
.tb{background:var(--purple-bg);color:var(--purple)}
.ti2{background:var(--amber-bg);color:var(--amber)}
.tp{background:var(--red-bg);color:var(--red)}
.done-pill{background:var(--green-bg);color:var(--green);font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px;display:inline-flex;align-items:center;gap:3px}
.lock-pill{background:var(--bg3);color:var(--text3);font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px;display:inline-flex;align-items:center;gap:3px}
.nda-pill{background:var(--blue-bg);color:var(--blue);font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:4px}

/* MEMBER HDR */
.mem-hdr{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.lv-pill{font-size:13px;font-weight:700;padding:5px 14px;border-radius:20px}
.lv-basic{background:var(--purple-bg);color:var(--purple)}
.lv-inter{background:var(--amber-bg);color:var(--amber)}
.lv-pro{background:var(--red-bg);color:var(--red)}
.prog-wrap{height:7px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:4px;background:var(--blue)}
.prog-fill.done{background:var(--green)}

/* COURSE GRID */
.lv-group{margin-bottom:20px}
.lv-lbl{font-size:13px;font-weight:700;padding:6px 14px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;margin-bottom:12px}
.ll-basic{background:var(--purple-bg);color:var(--purple)}
.ll-inter{background:var(--amber-bg);color:var(--amber)}
.ll-pro{background:var(--red-bg);color:var(--red)}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
@media(max-width:500px){.course-grid{grid-template-columns:1fr 1fr}}
@media(max-width:360px){.course-grid{grid-template-columns:1fr}}
.ccard{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ccard.click{cursor:pointer}
.ccard.click:active{border-color:#90BAF0;transform:scale(0.98)}
.ccard.locked{opacity:.5}
.cthumb{height:80px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border);font-size:36px}
.ct-wash{background:linear-gradient(135deg,#EBF1FF,#C9DDFF)}
.ct-fridge{background:linear-gradient(135deg,#E0F5FA,#B2EBF2)}
.cbody{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px}
.ctags{display:flex;gap:5px;flex-wrap:wrap}
.ctitle{font-size:13px;font-weight:700;line-height:1.4}
.learn-btn{margin-top:auto;padding:10px;border-radius:8px;border:1.5px solid var(--border2);background:transparent;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;min-height:var(--touch)}
.learn-btn:active:not(:disabled){background:var(--blue-bg);border-color:#90BAF0;color:var(--blue)}
.learn-btn:disabled{opacity:.4}

/* DETAIL */
.back-btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600;color:var(--text2);padding:8px 0;margin-bottom:14px;background:none;border:none;min-height:var(--touch)}
.detail-title{font-size:18px;font-weight:700;line-height:1.4;margin-bottom:14px}
@media(max-width:480px){.detail-title{font-size:16px}}
.detail-layout{display:grid;grid-template-columns:1fr 260px;gap:16px;align-items:start}
@media(max-width:700px){.detail-layout{grid-template-columns:1fr}}

/* VIDEO LANG SWITCHER */
.vlang-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.vlang-label{font-size:13px;font-weight:700;color:var(--text2);white-space:nowrap}
.vlang-btn{padding:8px 14px;border-radius:20px;border:1.5px solid var(--border2);background:var(--bg2);font-size:13px;font-weight:600;color:var(--text2);min-height:40px}
.vlang-btn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.vlang-btn:active:not(.on){background:var(--blue-bg)}

/* VIDEO */
.video-wrap{background:#000;border-radius:var(--r-lg);overflow:hidden;position:relative;width:100%;padding-top:56.25%;margin-bottom:12px}
.video-wrap iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:none}
.no-video-box{background:#151c28;border-radius:var(--r-lg);padding:28px 20px;text-align:center;margin-bottom:12px}
.no-video-box .nv-icon{font-size:36px;display:block;margin-bottom:10px}
.no-video-box p{font-size:14px;color:#8899aa;line-height:1.7}
.no-video-box b{color:#7dc8e3}

/* VIDEO UPLOAD (admin) */
.upload-info{background:var(--blue-bg);border:1px solid var(--blue-lt);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:16px}
.upload-info h3{font-size:14px;font-weight:700;color:var(--blue);margin-bottom:6px}
.upload-info p{font-size:13px;color:var(--blue);line-height:1.6;margin-bottom:4px}
.upload-form{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;margin-top:14px;box-shadow:var(--shadow)}
.upload-form h3{font-size:15px;font-weight:700;margin-bottom:14px}
.vlang-section{background:var(--blue-bg);border:1px solid var(--blue-lt);border-radius:var(--r);padding:14px;margin-bottom:14px}
.vlang-section h4{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:12px}
.vlang-row{margin-bottom:10px}
.vlang-row:last-child{margin-bottom:0}
.vlang-row label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:5px}
.vlang-row input{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:16px;background:var(--bg);color:var(--text);outline:none;font-family:monospace}
.vlang-row input:focus{border-color:var(--blue)}
.yt-badge{display:inline-flex;align-items:center;gap:4px;font-family:monospace;font-size:12px;padding:3px 8px;border-radius:4px}
.yt-badge.has{background:var(--green-bg);color:var(--green)}
.yt-badge.no{background:var(--red-bg);color:var(--red)}
.save-btn{padding:12px 20px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:14px;font-weight:700;min-height:var(--touch)}
.cancel-btn{padding:12px 16px;border-radius:var(--r);border:1.5px solid var(--border2);background:transparent;font-size:14px;color:var(--text2);margin-right:8px;min-height:var(--touch)}
.ff label{display:block;font-size:13px;font-weight:700;color:var(--text2);margin-bottom:5px}
.ff input,.ff select,.ff textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border2);border-radius:var(--r);font-size:16px;background:var(--bg);color:var(--text);outline:none}
.ff textarea{resize:vertical;min-height:60px;line-height:1.5}

/* WATCHED BOX */
.watch-box{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.watch-hdr{padding:12px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.watch-body{padding:14px}
.watch-desc{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:12px}
.wchk{display:flex;align-items:flex-start;gap:12px;padding:12px;border:1.5px solid var(--border);border-radius:var(--r);cursor:pointer;margin-bottom:8px;min-height:var(--touch)}
.wchk:active{border-color:var(--blue);background:var(--blue-bg)}
.wchk input[type=checkbox]{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--blue)}
.wchk-lbl{font-size:14px;line-height:1.6;cursor:pointer}
.confirm-btn{width:100%;padding:14px;border-radius:var(--r);background:var(--blue);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:10px;min-height:var(--touch)}
.confirm-btn:disabled{background:var(--bg3);color:var(--text3)}
.done-box{background:var(--green-bg);border:1px solid #7EC8A0;border-radius:var(--r-lg);padding:14px;margin-bottom:14px;display:flex;align-items:center;gap:10px}
.done-box .done-ico{font-size:28px}
.done-box strong{font-size:14px;color:var(--green);display:block}
.done-box small{font-size:13px;color:#2E7D52}

/* KP */
.kp-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.kp-card h4{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.kp-item{display:flex;gap:8px;align-items:flex-start;padding:6px 0;font-size:14px;line-height:1.5;border-bottom:1px solid var(--border)}
.kp-item:last-child{border-bottom:none}
.kp-dot{width:7px;height:7px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:6px}
.desc-card{background:var(--bg3);border-radius:var(--r);padding:14px;font-size:14px;color:var(--text2);line-height:1.8;margin-bottom:14px}

/* NAV BTNS */
.nav-btns{display:flex;gap:10px;margin-bottom:6px}
.nav-btn{flex:1;padding:12px;border-radius:var(--r);border:1.5px solid var(--border2);background:var(--bg2);font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:5px;min-height:var(--touch)}
.nav-btn:disabled{opacity:.35}
.nav-btn.nxt{background:var(--blue);color:#fff;border-color:var(--blue)}
.nav-btn.nxt:active:not(:disabled){background:#0D429E}

/* PROGRESS */
.prg-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow)}
.prg-hdr{padding:12px 14px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.prg-body{padding:12px 14px}
.prg-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:380px}
.prg-tbl th{font-size:11px;font-weight:700;color:var(--text2);padding:6px 8px;text-align:left;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.prg-tbl td{padding:8px 8px;border-bottom:1px solid var(--border)}
.prg-tbl tr:last-child td{border-bottom:none}

/* PAY MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:200;padding:0}
@media(min-width:500px){.modal-ov{align-items:center;padding:16px}}
.modal{background:var(--bg2);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:24px 20px 32px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
@media(min-width:500px){.modal{border-radius:var(--r-xl);padding:22px 20px}}
.modal h3{font-size:17px;font-weight:700;margin-bottom:16px}
.mf{margin-bottom:12px}

function ltag(l){return{basic:'tb',intermediate:'ti2',professional:'tp'}[l]||'';}
function lpC(l){return{basic:'lv-basic',intermediate:'lv-inter',professional:'lv-pro'}[l]||'';}
function llC(l){return{basic:'ll-basic',intermediate:'ll-inter',professional:'ll-pro'}[l]||'';}
function catC(c){return c==='washing'?'tw':'tf';}
function catThumb(c){return c==='washing'?'ct-wash':'ct-fridge';}
function isW(uid,cid){return!!(S.progress[uid]&&S.progress[uid][cid]&&S.progress[uid][cid].watched);}
function wAt(uid,cid){return(S.progress[uid]&&S.progress[uid][cid]&&S.progress[uid][cid].watchedAt)||'';}
function mkW(uid,cid){if(!S.progress[uid])S.progress[uid]={};S.progress[uid][cid]={watched:true,watchedAt:new Date().toISOString().slice(0,10)};}
function visCourses(u){var w=LW[u.level]||0;return S.courses.filter(function(c){return LW[c.level]<=w;});}
function isAcc(u,cid){var vc=visCourses(u);var i=vc.findIndex(function(c){return c.id===cid;});if(i<0)return false;if(i===0)return true;return isW(u.id,vc[i-1].id);}
function progOf(uid){var u=S.users.find(function(x){return x.id===uid;});if(!u||u.role!=='member')return{done:0,total:0};var vc=visCourses(u);return{done:vc.filter(function(c){return isW(uid,c.id);}).length,total:vc.length};}
function vidId(c,lang){return(c.ytId&&c.ytId[lang])||'';}
function ll(l){return l==='cn'?'华语':l==='en'?'English':'Bahasa Melayu';}

function render(){document.getElementById('app').innerHTML=buildApp();}

function buildApp(){
  var cu=S.currentUser;
  var needNda=cu&&cu.role==='member'&&!S.ndaSession;

        '<button class="lang-btn'+(S.lang==='en'?' on':'')+'" id="le">EN</button>'+
        '<button class="lang-btn'+(S.lang==='bm'?' on':'')+'" id="lb">BM</button>'+
      '</div>'+
      (cu?'<button class="logout-btn" id="logoutBtn">⬅ '+T('logout')+'</button>':'')+
    '</div>'+

              '<td>'+(w?'<span class="done-pill">✓ '+T('watched')+'</span>':'<span style="font-size:12px;color:var(--text3)">— '+T('unw')+'</span>')+'</td>'+
              '<td style="font-size:13px;color:var(--text2)">'+(wa||'—')+'</td></tr>';
          }).join('')+

function buildMember(){
  var cu=S.currentUser;
  var vc=visCourses(cu);
  var p=progOf(cu.id);var pct=p.total?Math.round(p.done/p.total*100):0;
  var levels=['basic','intermediate','professional'].filter(function(l){return LW[l]<=(LW[cu.level]||0);});

    '<div class="mem-hdr">'+
      '<div><div class="fw" style="font-size:15px">'+cu.name+'</div>'+
      '<div style="font-size:13px;color:var(--text2);margin-top:3px">'+T('curLv')+': <span class="lv-pill '+lpC(cu.level)+'">'+T(cu.level)+'</span></div></div>'+

        '<div style="font-size:12px;color:var(--text2);margin-top:3px">'+pct+'% '+T('progL')+'</div>'+

                '<span class="tag '+catC(c.cat)+'">'+T(c.cat)+'</span>'+

                (w?'<span class="done-pill">✓ '+T('watched')+'</span>':'')+
                (!acc?'<span class="lock-pill">🔒</span>':'')+
              '</div>'+
              '<div class="ctitle">'+c.title[S.lang]+'</div>'+
              '<button class="learn-btn" data-open="'+c.id+'"'+(acc?'':' disabled')+'>'+

      '<div class="modal-acts">'+
        '<button class="btn-sec" id="closeModal">'+T('cancel')+'</button>'+
        '<button class="btn-pri" id="confirmPay">✓ 确认</button>'+
      '</div></div></div>';
}

// ── EVENT DELEGATION (mobile-safe, no inline onclick) ──
document.addEventListener('click',function(e){
  var el=e.target;
  // lang
  if(el.id==='lc'){setLang('cn');return;}
  if(el.id==='le'){setLang('en');return;}
  if(el.id==='lb'){setLang('bm');return;}
  // logout
  if(el.id==='logoutBtn'){doLogout();return;}
  // login
  if(el.id==='loginBtn'){doLogin();return;}
  // hint rows
  if(el.closest('[data-fi]')){var r=el.closest('[data-fi]');fillCred(S.users[+r.dataset.fi].email,S.users[+r.dataset.fi].password);return;}
  // tabs
  if(el.id==='tab-members'){setTab('members');return;}
  if(el.id==='tab-payment'){setTab('payment');return;}
  if(el.id==='tab-progress'){setTab('progress');return;}
  if(el.id==='tab-courses'){setTab('courses');return;}
  // toggle member status
  if(el.dataset.toggle){toggleUser(el.dataset.toggle);return;}
  // pay
  if(el.dataset.paynow){S.payModal=S.users.find(function(u){return u.id===el.dataset.paynow;});render();return;}
  if(el.dataset.editpay){S.payModal=S.users.find(function(u){return u.id===el.dataset.editpay;});render();return;}
  if(el.id==='closeModal'){S.payModal=null;render();return;}
  if(el.id==='modalOv'&&e.target===el){S.payModal=null;render();return;}
  if(el.id==='confirmPay'){confirmPay();return;}
  // edit video
  if(el.dataset.editvid){S.editingVideo=el.dataset.editvid;render();setTimeout(function(){var i=document.getElementById('vid-cn');if(i)i.focus();},50);return;}
  if(el.id==='cancelVidBtn'){S.editingVideo=null;render();return;}
  if(el.dataset.savevid){saveVids(el.dataset.savevid);return;}
  if(el.id==='saveVidBtn'){var b=document.querySelector('[data-savevid]');if(b)saveVids(b.dataset.savevid);return;}
  // NDA
  if(el.id==='ndaA'){S.ndaA=el.checked;updNda();return;}
  if(el.id==='ndaB'){S.ndaB=el.checked;updNda();return;}
  if(el.id==='ndaBtn'){agreeNda();return;}
  // open course card or button
  var card=el.closest('[data-cid]');
  if(card&&card.dataset.acc==='1'){openCourse(card.dataset.cid);return;}
  if(el.dataset.open&&el.dataset.open!=='undefined'){openCourse(el.dataset.open);return;}
  // back
  if(el.id==='backBtn'){S.viewCourse=null;render();window.scrollTo(0,0);return;}
  // video lang
  if(el.dataset.vl){S.videoLang=el.dataset.vl;render();return;}
  // watched checkboxes
  if(el.id==='wc1'){S.wc1=el.checked;updCfm();return;}
  if(el.id==='wc2'){S.wc2=el.checked;updCfm();return;}
  if(el.id==='cfmBtn'){confirmWatched();return;}
  // prev/next lesson
  if(el.id==='prevBtn'){navC(-1);return;}
  if(el.id==='nextBtn'){navC(1);return;}
},true);

// Enter key on login
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(document.activeElement.id==='em'||document.activeElement.id==='pw'))doLogin();
});

function updNda(){var b=document.getElementById('ndaBtn');if(b)b.disabled=!(S.ndaA&&S.ndaB);}
function updCfm(){var b=document.getElementById('cfmBtn');if(b)b.disabled=!(S.wc1&&S.wc2);}

function agreeNda(){
  if(!S.ndaA||!S.ndaB)return;
  S.users=S.users.map(function(u){return u.id===S.currentUser.id?Object.assign({},u,{ndaCount:u.ndaCount+1}):u;});
  S.currentUser=Object.assign({},S.currentUser,{ndaCount:S.currentUser.ndaCount+1});
  S.ndaSession=true;S.videoLang=S.lang;render();
}

function saveVids(cid){
  var cn=document.getElementById('vid-cn').value.trim();
  var en=document.getElementById('vid-en').value.trim();
  var bm=document.getElementById('vid-bm').value.trim();
  S.courses=S.courses.map(function(c){return c.id===cid?Object.assign({},c,{ytId:{cn:cn,en:en,bm:bm}}):c;});
  S.editingVideo=null;render();
  alert(S.lang==='cn'?'✓ 视频 ID 已保存！':S.lang==='en'?'✓ Video IDs saved!':'✓ ID Video disimpan!');
}

function confirmWatched(){
  var cu=S.currentUser,c=S.viewCourse;
  mkW(cu.id,c.id);
  var vc=visCourses(cu);var idx=vc.findIndex(function(x){return x.id===c.id;});
  if(idx<vc.length-1){S.viewCourse=vc[idx+1];S.wc1=false;S.wc2=false;}
  else{S.viewCourse=null;}
  render();window.scrollTo(0,0);
}

function navC(dir){
  var cu=S.currentUser;var vc=visCourses(cu);
  var idx=vc.findIndex(function(x){return x.id===S.viewCourse.id;});
  var ni=idx+dir;
  if(ni>=0&&ni<vc.length&&isAcc(cu,vc[ni].id)){S.viewCourse=vc[ni];S.wc1=false;S.wc2=false;render();window.scrollTo(0,0);}
}

function setLang(l){S.lang=l;if(S.ndaSession)S.videoLang=l;render();}
function setTab(t){S.tab=t;S.editingVideo=null;render();}
function fillCred(em,pw){var e=document.getElementById('em'),p=document.getElementById('pw');if(e)e.value=em;if(p)p.value=pw;}
function doLogout(){S.currentUser=null;S.viewCourse=null;S.ndaSession=false;S.ndaA=false;S.ndaB=false;S.wc1=false;S.wc2=false;render();}
function toggleUser(id){
  S.users=S.users.map(function(u){
    if(u.id===id){var ns=u.status==='ON'?'OFF':'ON';if(S.currentUser&&S.currentUser.id===id&&ns==='OFF')S.currentUser=null;return Object.assign({},u,{status:ns});}return u;
  });render();
}
function openCourse(id){
  var c=S.courses.find(function(x){return x.id===id;});
  if(c&&isAcc(S.currentUser,c.id)){S.viewCourse=c;S.wc1=false;S.wc2=false;S.videoLang=S.lang;render();window.scrollTo(0,0);}
}
function confirmPay(){
  var d=document.getElementById('pmDate').value,a=document.getElementById('pmAmt').value,lv=document.getElementById('pmLv').value;
  S.users=S.users.map(function(u){return u.id===S.payModal.id?Object.assign({},u,{paid:true,paidDate:d,paidAmount:a,level:lv}):u;});
  S.payModal=null;render();
}
function doLogin(){
  var em=document.getElementById('em');var pw=document.getElementById('pw');
  if(!em||!pw)return;
  var user=S.users.find(function(u){return u.email===em.value&&u.password===pw.value;});
  if(!user){S.loginError=T('wrongPw');render();return;}
  if(user.role!=='principal'&&user.status==='OFF'){S.loginError=T('noAuth');render();return;}
  S.currentUser=Object.assign({},user);S.loginError='';
  S.ndaSession=false;S.ndaA=false;S.ndaB=false;S.wc1=false;S.wc2=false;S.viewCourse=null;S.videoLang=S.lang;
  render();window.scrollTo(0,0);
}

render();
</script>
</body>
